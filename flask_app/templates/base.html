<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MUN SaaS - Modern Model United Nations Management Platform">
    <title>{% block title %}Concordia{% endblock %}</title>

    <!-- Google Fonts: DM Sans + Space Mono (design tokens) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Animate.css for entrance + scroll-triggered animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" integrity="sha512-c42qTSw/wPZ3/5LBzD+Bw5f7bSF2oxou6wEb+I/lqeaKV5FDIfMvvRp772y4jcJLKuGUOpbJMdg/BTl50fJYAw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <style>
      /* Premium Grain Overlay */
      .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }
      .auth-toggle-password {
        position: absolute;
        top: 50%;
        right: 1rem;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        color: var(--color-muted);
      }
      .auth-toggle-password svg {
        width: 20px;
        height: 20px;
      }
      .btn-close-flash {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--color-muted);
      }
      .btn-icon {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(10px);
      }
      /* Notification Modal */
      .modal {
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.4);
      }
      .modal-content {
        background-color: var(--color-surface);
        margin: 15% auto;
        padding: 20px;
        border: 1px solid var(--color-border);
        width: 80%;
        max-width: 500px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        color: white;
      }
      .modal-header h2 {
        margin: 0;
        font-size: 1.5rem;
        color: white;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--color-divider);
      }
      .modal-header h2 {
        margin: 0;
        font-size: 1.5rem;
      }
      .close-modal {
        color: var(--color-muted);
        font-size: 28px;
        font-weight: bold;
      }
      .close-modal:hover,
      .close-modal:focus {
        color: var(--color-primary);
        text-decoration: none;
        cursor: pointer;
      }
      .modal-body {
        padding: 1rem 0;
      }
      .modal-footer {
        padding-top: 1rem;
        border-top: 1px solid var(--color-divider);
        text-align: right;
      }
      .notification-count {
        position: absolute;
        top: 0px;
        right: 0px;
        background-color: var(--color-danger);
        color: white;
        border-radius: 50%;
        padding: 0.2em 0.5em;
        font-size: 0.7rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--color-surface);
      }
      .notification-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem;
        border-bottom: 1px solid var(--color-divider);
      }
      .notification-item:last-child {
        border-bottom: none;
      }
      .notification-item p {
        margin: 0;
        font-size: 0.9rem;
      }
      .notification-item.notification-success { border-left: 3px solid var(--color-success); }
      .notification-item.notification-warning { border-left: 3px solid var(--color-warning); }
      .notification-item.notification-error { border-left: 3px solid var(--color-danger); }
      .notification-item.notification-info { border-left: 3px solid var(--color-info); }

      .clear-notification {
        background: none;
        border: none;
        color: var(--color-muted);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0 0.5rem;
      }
    </style>
  </head>

  <body class="mun-app {% block body_class %}{% endblock %}">
    <!-- Grain Texture Overlay -->
    <div class="grain-overlay"></div>

    {% block navbar %}
    <!-- Floating Glass Pill Navigation -->
    <nav class="navbar">
      <div class="container">
        <a class="brand" href="/dashboard">
          <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="100" height="100" rx="24" fill="url(#grad)"/>
            <path d="M30 40 L65 40 L75 50 L75 70 L25 70 L25 50 Z" fill="var(--primary-foreground)" opacity="0.92"/>
            <circle cx="40" cy="60" r="8" fill="var(--primary-foreground)"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="100" y2="100">
                <stop offset="0%" stop-color="#ff8a7a"/>
                <stop offset="100%" stop-color="#ff6f61"/>
              </linearGradient>
            </defs>
          </svg>
          <span>MUN SaaS</span>
        </a>

        <div class="nav-links">
          <a class="nav-link" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/events">Events</a>
          <a class="nav-link" href="/logout">Logout</a>
        </div>
      </div>
    </nav>
    {% endblock %}

    <!-- Main Content -->
    <main class="site-main {% block main_class %}{% endblock %}">
      <!-- Page Content -->
      {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <footer class="site-footer">
      <div class="site-footer-inner">
        <p class="site-footer-copy">© {{ now.year if now else 2026 }} MUN SaaS. Empowering education through technology.</p>
        <div class="site-footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Support</a>
        </div>
      </div>
    </footer>
    {% endblock %}

    <!-- Bootstrap JS Bundle (kept for forms/utilities) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Overdrive: Animated Counters + Virtual Scroll -->
    <script>
      // ═══════════════════════════════════════════════════════════════
      // OVERDRIVE: Animated Number Counters (Web Animations API)
      // ═══════════════════════════════════════════════════════════════
      function animateCounter(el, target, duration) {
        const start = 0;
        const startTime = performance.now();
        const isFloat = target % 1 !== 0;
        
        function update(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // Ease out expo for dramatic count
          const eased = 1 - Math.pow(1 - progress, 4);
          const current = start + (target - start) * eased;
          el.textContent = isFloat ? current.toFixed(1) : Math.round(current);
          
          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            el.textContent = isFloat ? target : target;
          }
        }
        requestAnimationFrame(update);
      }

      // Observe counter elements and animate when visible
      const counterObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          const target = parseFloat(el.dataset.countTo);
          const duration = parseInt(el.dataset.duration || '1500', 10);
          
          // Stagger by index if multiple counters
          const idx = parseInt(el.dataset.counterIndex || '0', 10);
          setTimeout(() => {
            animateCounter(el, target, duration);
          }, idx * 120);
          
          counterObserver.unobserve(el);
        });
      }, { threshold: 0.5 });

      document.querySelectorAll('[data-count-to]').forEach((el, i) => {
        el.dataset.counterIndex = i;
        counterObserver.observe(el);
      });

      // ═══════════════════════════════════════════════════════════════
      // OVERDRIVE: Virtual Scroll for Large Lists
      // ═══════════════════════════════════════════════════════════════
      class VirtualScroll {
        constructor(container, options = {}) {
          this.container = container;
          this.itemHeight = options.itemHeight || 72;
          this.itemBuffer = options.itemBuffer || 5;
          this.renderFn = options.renderFn || (() => '');
          this.data = [];
          this.visibleStart = 0;
          this.visibleEnd = 0;
          this.scrollTop = 0;
          this.containerHeight = 0;
          
          this.init();
        }
        
        init() {
          this.containerHeight = this.container.clientHeight;
          
          this.container.addEventListener('scroll', () => this.onScroll(), { passive: true });
          this.update();
        }
        
        setData(data) {
          this.data = data;
          this.container.style.height = (this.data.length * this.itemHeight) + 'px';
          this.update();
        }
        
        onScroll() {
          this.scrollTop = this.container.scrollTop;
          this.update();
        }
        
        update() {
          const startIdx = Math.max(0, Math.floor(this.scrollTop / this.itemHeight) - this.itemBuffer);
          const visibleCount = Math.ceil(this.containerHeight / this.itemHeight) + (this.itemBuffer * 2);
          const endIdx = Math.min(this.data.length, startIdx + visibleCount);
          
          if (startIdx === this.visibleStart && endIdx === this.visibleEnd) return;
          
          this.visibleStart = startIdx;
          this.visibleEnd = endIdx;
          
          this.render();
        }
        
        render() {
          const html = [];
          const spacerHeight = this.visibleStart * this.itemHeight;
          
          for (let i = this.visibleStart; i < this.visibleEnd; i++) {
            html.push(this.renderFn(this.data[i], i));
          }
          
          this.container.innerHTML = (
            '<div style="height:' + spacerHeight + 'px;"></div>' +
            html.join('') +
            '<div style="height:' + ((this.data.length - this.visibleEnd) * this.itemHeight) + 'px;"></div>'
          );
        }
      }

      // Auto-initialize virtual scroll containers
      document.querySelectorAll('[data-virtual-scroll]').forEach(el => {
        const data = JSON.parse(el.dataset.delegates || '[]');
        const itemHeight = parseInt(el.dataset.itemHeight || '72', 10);
        
        const virtual = new VirtualScroll(el, {
          itemHeight: itemHeight,
          renderFn: (item, idx) => {
            return `<li class="mun-list-item mun-spotlight-card" style="height:${itemHeight}px;display:flex;align-items:center;">
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-3);width:100%;">
                <div>
                  <strong style="color:var(--foreground);">${item.name || ''}</strong>
                  <span class="text-secondary" style="margin-left:var(--space-2);">${item.email || ''}</span>
                  <div class="mun-list-item__meta" style="margin-top:var(--space-1);">${item.country || '—'} · ${item.committee || 'No committee'}</div>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);">
                  <a href="/events/${item.event_id}/delegates/${item.id}/documents" class="btn btn-sm btn-outline-secondary ripple">Docs</a>
                  <a href="/events/${item.event_id}/delegates/${item.id}/edit" class="btn btn-sm btn-outline-success ripple">Edit</a>
                </div>
              </div>
            </li>`;
          }
        });
        
        virtual.setData(data);
        el.dataset.virtualScroll = 'initialized';
      });

      // Overdrive: Search filter with instant results
      document.querySelectorAll('[data-instant-filter]').forEach(input => {
        input.addEventListener('input', () => {
          const query = input.value.toLowerCase();
          const targets = document.querySelectorAll('[data-filter-target]');
          
          targets.forEach(el => {
            const text = el.textContent.toLowerCase();
            el.style.display = text.includes(query) ? '' : 'none';
          });
        });
      });
    </script>

    <!-- Scroll: .reveal (CSS transition) + .animate-on-scroll (Animate.css) -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
          window.addEventListener('mousemove', function (e) {
            document.documentElement.style.setProperty('--pointer-x', e.clientX + 'px');
            document.documentElement.style.setProperty('--pointer-y', e.clientY + 'px');
          }, { passive: true });
        }

        document.querySelectorAll('.mun-spotlight-card').forEach(function (card) {
          card.addEventListener('mousemove', function (e) {
            var r = card.getBoundingClientRect();
            card.style.setProperty('--spot-x', (e.clientX - r.left) + 'px');
            card.style.setProperty('--spot-y', (e.clientY - r.top) + 'px');
          });
        });

        const observerOptions = {
          root: null,
          rootMargin: '0px 0px -10% 0px',
          threshold: 0.12
        };

        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
          });
        }, observerOptions);

        const animateObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const el = entry.target;
            const name = el.dataset.animate || 'fadeInUp';
            const animClass = name.startsWith('animate__') ? name : 'animate__' + name;
            if (el.dataset.delay != null && el.dataset.delay !== '') {
              el.style.animationDelay = parseInt(el.dataset.delay, 10) + 'ms';
            }
            if (el.dataset.duration != null && el.dataset.duration !== '') {
              el.style.animationDuration = el.dataset.duration + 's';
            }
            el.classList.add('animate__animated', animClass);
            animateObserver.unobserve(el);
          });
        }, observerOptions);

        if (prefersReducedMotion) {
          document.querySelectorAll('.animate-on-scroll').forEach(el => {
            el.classList.add('animate-on-scroll--static');
          });
          document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
        } else {
          document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
          document.querySelectorAll('.animate-on-scroll').forEach(el => animateObserver.observe(el));
        }

        const cascadeItems = document.querySelectorAll('.cascade-enter');
        cascadeItems.forEach((item, index) => {
          item.style.animationDelay = `${index * 100}ms`;
        });
      });

      // Ripple effect for buttons
      function createRipple(event) {
        const button = event.currentTarget;
        const ripple = document.createElement('span');
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = event.clientX - rect.left - size / 2;
        const y = event.clientY - rect.top - size / 2;

        ripple.style.cssText = `
          position: absolute;
          width: ${size}px;
          height: ${size}px;
          left: ${x}px;
          top: ${y}px;
          background: color-mix(in srgb, var(--primary) 35%, transparent);
          border-radius: 50%;
          transform: scale(0);
          animation: ripple-animation 0.6s ease-out;
          pointer-events: none;
        `;

        button.style.position = 'relative';
        button.style.overflow = 'hidden';
        button.appendChild(ripple);

        setTimeout(() => ripple.remove(), 600);
      }

      // Add ripple to all .btn elements
      document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', createRipple);
      });

      // Add ripple keyframes
      const style = document.createElement('style');
      style.textContent = `
        @keyframes ripple-animation {
          to {
            transform: scale(4);
            opacity: 0;
          }
        }
      `;
      document.head.appendChild(style);
    </script>

    <!-- Ion Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
