<div id="notification-modal" class="modal" style="display: none; color: var(--color-primary);">
  <div class="modal-content">
    <div class="modal-header">
      <h2 style="color: white;">Notifications</h2>
      <span class="close-modal">&times;</span>
    </div>
    <div class="modal-body" id="notification-list">
      <!-- Notifications will be loaded here -->
      <p style="color: white;">No new notifications</p>
    </div>
    <div class="modal-footer">
      <button id="clear-all-notifications" class="btn btn-primary">Clear all</button>
    </div>
  </div>
</div>
