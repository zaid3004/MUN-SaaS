{% extends 'base.html' %}
{% block content %}
<h2>Chat (Event {{ event_id }})</h2>
<form method="post" class="mb-3">
  <div class="input-group">
    <input type="text" name="message" class="form-control" placeholder="Type a message" required>
    <button class="btn btn-primary" type="submit">Send</button>
  </div>
</form>
<div class="list-group" style="max-height: 400px; overflow: auto;">
  {% for m in messages %}
  <div class="list-group-item">
    <strong>{{ m.sender.email or m.sender.name }}</strong> <span class="text-muted small">{{ m.timestamp }}</span>
    <div>{{ m.message }}</div>
  </div>
  {% endfor %}
  {% if not messages %}
  <div class="list-group-item">No messages yet.</div>
  {% endif %}
</div>
{% endblock %}
