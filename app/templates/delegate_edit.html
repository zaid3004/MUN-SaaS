{% extends 'base.html' %}

{% block title %}Edit Delegate{% endblock %}

{% block content %}
<section class="mb-8">
  <div class="container" style="max-width: 560px;">
    <div class="mun-page-head">
      <div>
        <span class="badge badge-primary mb-2">Delegate</span>
        <h1 class="mun-page-head__title">Edit profile</h1>
        <p class="text-secondary mt-2" style="margin-top: var(--space-2); margin-bottom: 0;">Update credentials and committee</p>
      </div>
    </div>

    <div class="card mun-spotlight-card" style="padding: var(--space-8);">
      <form method="post">
        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="country">Country</label>
          <input type="text" id="country" name="country" class="form-control" value="{{ user.country }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Leave blank to keep current">
        </div>
        <div class="form-group">
          <label class="form-label" for="committee_id">Committee</label>
          <select class="form-control" id="committee_id" name="committee_id">
            <option value="">None</option>
            {% for c in committees %}
            <option value="{{ c.id }}" {% if c.id == committee_id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <button class="btn btn-primary ripple" type="submit" style="width: 100%; margin-top: var(--space-2);">Save changes</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
