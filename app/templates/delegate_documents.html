{% extends 'base.html' %}
{% block content %}
<h2>Delegate Documents (Delegate {{ delegate_id }})</h2>
{% if documents %}
  <ul class="list-group mb-4">
    {% for d in documents %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <span>{{ d.filename }} ({{ d.doc_type }})</span>
      <a href="/documents/{{ d.id }}/download" class="btn btn-sm btn-outline-secondary">Download</a>
    </li>
    {% endfor %}
  </ul>
{% else %}
  <p>No documents for this delegate.</p>
{% endif %}
{% endblock %}
