{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% set hide_nav = True %}

{% block content %}
<section class="auth-section" style="min-height: calc(100dvh - 200px); display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4); position: relative; overflow: hidden;">

  <!-- Water Background Decoration -->
  <div class="wave-container" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; opacity: 0.1;">
    <div class="wave" style="animation-duration: 20s;"></div>
    <div class="wave" style="animation-duration: 15s; animation-direction: reverse;"></div>
  </div>

  <div class="container" style="max-width: 480px; position: relative; z-index: 2;">
    <div class="card animate__animated animate__fadeInUp" style="animation-duration: 0.8s; backdrop-filter: blur(12px);">
      <div class="card-body" style="padding: var(--space-10); position: relative; overflow: hidden;">

        <!-- Decorative Header Wave -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--color-accent), var(--color-highlight), var(--color-accent)); background-size: 200% 100%; animation: shimmer-gradient 3s infinite linear;"></div>

        <!-- Logo & Title -->
        <div class="text-center mb-8" style="text-align: center; margin-bottom: var(--space-8);">
          <div style="width: 64px; height: 64px; margin: 0 auto var(--space-4); background: linear-gradient(135deg, var(--color-accent), var(--color-highlight)); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: var(--shadow-lg);">
            🌊
          </div>
          <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: var(--space-2); color: var(--color-primary);">Welcome Back</h1>
          <p class="text-secondary" style="color: var(--color-secondary); margin: 0;">Sign in to your MUN SaaS account</p>
        </div>

        <!-- Login Form -->
        <form method="post" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="you@school.edu"
              required
              autocomplete="email"
              style="padding-left: var(--space-12); position: relative;"
            >
            <svg class="input-icon" style="position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--color-secondary); pointer-events: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
          </div>

          {% if error %}
            <div class="alert" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--color-error); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2); font-size: 0.875rem;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              {{ error }}
            </div>
          {% endif %}

          <div class="d-flex justify-between items-center mb-6" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
            <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: 0.875rem; color: var(--color-secondary);">
              <input type="checkbox" name="remember" style="width: 16px; height: 16px; accent-color: var(--color-accent);">
              <span>Remember me</span>
            </label>
            <a href="/forgot-password" class="text-accent" style="color: var(--color-accent); font-size: 0.875rem; font-weight: 500;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary ripple w-full" style="width: 100%; font-weight: 600; padding: var(--space-3) var(--space-6);">
            Sign In
          </button>
        </form>

        <div class="divider my-6" style="display: flex; align-items: center; margin: var(--space-6) 0; color: var(--color-secondary); font-size: 0.875rem;">
          <div style="flex: 1; height: 1px; background: var(--color-divider);"></div>
          <span style="padding: 0 var(--space-4);">or</span>
          <div style="flex: 1; height: 1px; background: var(--color-divider);"></div>
        </div>

        <div class="text-center" style="text-align: center;">
          <p class="text-secondary mb-4" style="color: var(--color-secondary); margin-bottom: var(--space-4); font-size: 0.875rem;">
            New to MUN SaaS?
          </p>
          <a href="/register" class="btn btn-secondary ripple" style="font-weight: 500;">
            Create Account
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Shimmer Gradient Animation -->
<style>
  @keyframes shimmer-gradient {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
{% endblock %}
